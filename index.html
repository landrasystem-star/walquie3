<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Walkie Talkie - Redirigir WAV al otro (CORREGIDO)</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0f;
            font-family: system-ui, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #2c2c3e;
            border-radius: 40px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            color: #ff6b6b;
            text-align: center;
            margin: 0 0 20px;
            font-size: 1.8rem;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            border: none;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input {
            background: #0a0a0f;
            border: 1px solid #3a3a4a;
            color: white;
            text-align: center;
        }

        button {
            background: #ff6b6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .id-box {
            background: #0a0a0f;
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            text-align: center;
            margin: 10px 0;
            word-break: break-all;
            color: #2ed573;
            font-size: 12px;
        }

        .ptt {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(#e74c3c, #c0392b);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.05s linear;
            text-align: center;
        }

        .ptt:active {
            transform: scale(0.95);
        }

        .ptt.listening {
            background: radial-gradient(#34495e, #2c3e50);
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            font-size: 0.85rem;
            background: #1e1e2a;
            padding: 8px;
            border-radius: 20px;
        }

        .manos-libres {
            background: #3498db;
            margin-top: 10px;
        }

        .manos-libres.activo {
            background: #e67e22;
        }

        .alarma {
            background: #e74c3c;
        }

        .botonera {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .seccion-sonido {
            background: #1e1e2e;
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
        }

        .seccion-sonido h3 {
            color: #ffb347;
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            text-align: center;
        }

        .file-label {
            background: #2c6e9e;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 5px 0;
        }

        input[type="file"] {
            display: none;
        }

        .info-wav {
            background: #0a0a0f;
            border-radius: 10px;
            padding: 8px;
            margin-top: 10px;
            font-size: 11px;
            text-align: center;
            color: #ffb347;
            font-family: monospace;
        }

        .btn-enviar {
            background: #e67e22;
            margin-top: 10px;
        }

        .spinner {
            display: none;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: #2c3e50;
            border-radius: 20px;
            color: white;
        }

        .volumen-control {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volumen-control label {
            color: #aaa;
            font-size: 12px;
        }

        input[type="range"] {
            flex: 1;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📻 WALKIE TALKIE</h1>
    
    <input type="text" id="username" placeholder="Tu nombre">
    <div class="id-box" id="myId">Esperando ID...</div>
    
    <input type="text" id="otherId" placeholder="ID de la otra persona">
    <button id="connect">🔗 CONECTAR</button>
    
    <div class="botonera">
        <div id="ptt" class="ptt listening">🎤<br>PTT<br><span style="font-size:0.6rem;">Mantener</span></div>
        <button id="manosLibres" class="manos-libres">🔊 MANOS LIBRES (OFF)</button>
        <button id="alarmaBtn" class="alarma">🚨 TIMBRE / ALARMA</button>
    </div>

    <div class="seccion-sonido">
        <h3>🎵 ENVIAR WAV (redirigido al otro)</h3>
        
        <label class="file-label">📁 SELECCIONAR WAV/MP3
            <input type="file" id="audioFile" accept="audio/*">
        </label>
        
        <div class="volumen-control">
            <label>🔊 Volumen:</label>
            <input type="range" id="volumenWav" min="0" max="100" value="80">
        </div>
        
        <button id="enviarBtn" class="btn-enviar" disabled>🎵 ENVIAR WAV AL OTRO WALKIE</button>
        
        <div class="spinner" id="spinner">🎵 Inyectando WAV directamente en la llamada...</div>
        
        <div class="info-wav" id="infoWav">
            💡 El WAV se inyecta DIRECTAMENTE en el stream de audio<br>
            🔇 TÚ **NO** lo escuchas, solo el otro walkie
        </div>
    </div>
    
    <div class="status" id="status">📡 Desconectado</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
    // ============================================
    // REDIRIGIR WAV DIRECTAMENTE AL OTRO - CORREGIDO
    // ============================================
    
    let peer = null;
    let localStream = null;
    let call = null;
    let audioRemoto = null;
    let connected = false;
    let manosLibresActivo = false;
    let miNombre = '';
    let archivoSeleccionado = null;
    
    // Para manipulación de audio
    let audioContext = null;
    let originalAudioTrack = null;
    
    // DOM elements
    const usernameInput = document.getElementById('username');
    const myIdDiv = document.getElementById('myId');
    const otherIdInput = document.getElementById('otherId');
    const connectBtn = document.getElementById('connect');
    const ptt = document.getElementById('ptt');
    const manosLibresBtn = document.getElementById('manosLibres');
    const alarmaBtn = document.getElementById('alarmaBtn');
    const statusSpan = document.getElementById('status');
    const audioFileInput = document.getElementById('audioFile');
    const enviarBtn = document.getElementById('enviarBtn');
    const spinner = document.getElementById('spinner');
    const infoWav = document.getElementById('infoWav');
    const volumenWav = document.getElementById('volumenWav');
    
    function mostrarMensaje(texto, esError = false) {
        statusSpan.innerHTML = texto;
        if (esError) {
            setTimeout(() => {
                if (connected) statusSpan.innerHTML = '✅ Conectado';
                else statusSpan.innerHTML = '📡 Desconectado';
            }, 3000);
        }
    }
    
    // ========== ALARMA ==========
    function sonarAlarmaReceptor() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.35;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.8);
            osc.stop(audioCtx.currentTime + 0.8);
            audioCtx.resume();
        } catch(e) {}
    }
    
    // ========== INYECTAR WAV DIRECTAMENTE ==========
    async function inyectarWavALlamada(file) {
        if (!connected || !call || !call.peerConnection) {
            mostrarMensaje('⚠️ Conecta primero al otro walkie', true);
            return false;
        }
        
        if (!file) {
            mostrarMensaje('📁 Selecciona un archivo de audio', true);
            return false;
        }
        
        spinner.style.display = 'block';
        enviarBtn.disabled = true;
        
        try {
            // Inicializar AudioContext
            if (!audioContext || audioContext.state === 'closed') {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            // Asegurar que el AudioContext esté activo
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            
            // Leer el archivo WAV
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            // Obtener el sender de audio de la llamada
            const senders = call.peerConnection.getSenders();
            const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
            
            if (!audioSender) {
                throw new Error('No se encontró el canal de audio');
            }
            
            // Guardar el track original para restaurar después
            if (!originalAudioTrack) {
                originalAudioTrack = audioSender.track;
            }
            
            // Crear un nuevo stream con el WAV
            // Método: crear un nodo de destino y obtener su track
            const dest = audioContext.createMediaStreamDestination();
            
            // Nodo de ganancia para controlar volumen
            const gainNode = audioContext.createGain();
            const volumen = volumenWav.value / 100;
            gainNode.gain.value = volumen;
            
            // Fuente del WAV
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            
            // Conectar: source -> gain -> dest
            source.connect(gainNode);
            gainNode.connect(dest);
            
            // Obtener el track del stream de destino
            const newTrack = dest.stream.getAudioTracks()[0];
            
            if (!newTrack) {
                throw new Error('No se pudo crear el track de audio');
            }
            
            // Reemplazar el track
            await audioSender.replaceTrack(newTrack);
            
            mostrarMensaje(`🎵 Enviando "${file.name}" al otro walkie...`);
            infoWav.innerHTML = `🎵 Enviando WAV directamente (tú NO lo oyes) - Volumen: ${volumenWav.value}%`;
            
            // Iniciar reproducción
            source.start();
            
            // Esperar a que termine
            await new Promise(resolve => {
                source.onended = resolve;
            });
            
            // Restaurar el track original
            if (originalAudioTrack) {
                await audioSender.replaceTrack(originalAudioTrack);
            }
            
            // Limpiar
            source.disconnect();
            gainNode.disconnect();
            
            mostrarMensaje(`✅ WAV enviado al otro walkie`);
            infoWav.innerHTML = `✅ "${file.name}" reproducido en el otro dispositivo (tú no lo oíste)`;
            
            setTimeout(() => {
                spinner.style.display = 'none';
                enviarBtn.disabled = false;
                if (connected) mostrarMensaje('✅ Conectado');
            }, 2000);
            
            return true;
            
        } catch(err) {
            console.error('Error:', err);
            mostrarMensaje(`❌ Error: ${err.message}`, true);
            spinner.style.display = 'none';
            enviarBtn.disabled = false;
            infoWav.innerHTML = `❌ Error: ${err.message}`;
            
            // Intentar restaurar el stream original
            if (call && call.peerConnection && originalAudioTrack) {
                try {
                    const senders = call.peerConnection.getSenders();
                    const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
                    if (audioSender) {
                        await audioSender.replaceTrack(originalAudioTrack);
                    }
                } catch(e) {}
            }
            return false;
        }
    }
    
    // ========== PEERJS ==========
    peer = new Peer({ host: '0.peerjs.com', port: 443, secure: true });
    
    peer.on('open', id => {
        myIdDiv.innerHTML = `📱 TU ID: ${id}<br>📛 ${miNombre || 'Sin nombre'}`;
        mostrarMensaje('✅ Listo. Comparte este ID');
    });
    
    peer.on('call', incoming => {
        if (localStream) {
            incoming.answer(localStream);
            configurarLlamada(incoming);
        }
    });
    
    peer.on('error', err => {
        console.error(err);
        mostrarMensaje('❌ Error de conexión', true);
    });
    
    // Micrófono
    navigator.mediaDevices.getUserMedia({ 
        audio: { 
            echoCancellation: true, 
            noiseSuppression: true,
            autoGainControl: true
        } 
    })
    .then(stream => { 
        localStream = stream;
        originalAudioTrack = stream.getAudioTracks()[0];
        // Por defecto micrófono apagado (modo PTT)
        localStream.getTracks().forEach(t => t.enabled = false);
        mostrarMensaje('🎤 Micrófono listo');
    })
    .catch(e => { 
        console.error(e);
        mostrarMensaje('❌ Permiso de micrófono denegado', true); 
    });
    
    function configurarLlamada(c) {
        call = c;
        connected = true;
        mostrarMensaje('✅ Conectado - Escuchando');
        
        // Audio remoto (lo que dice el otro)
        c.on('stream', stream => {
            if (audioRemoto) audioRemoto.pause();
            audioRemoto = new Audio();
            audioRemoto.srcObject = stream;
            audioRemoto.autoplay = true;
            audioRemoto.volume = 1.0;
        });
        
        c.on('close', () => {
            connected = false;
            mostrarMensaje('❌ Desconectado');
            if (manosLibresActivo) {
                manosLibresActivo = false;
                manosLibresBtn.innerHTML = '🔊 MANOS LIBRES (OFF)';
                manosLibresBtn.classList.remove('activo');
            }
            ptt.classList.add('listening');
            ptt.innerHTML = '🎤<br>PTT';
        });
    }
    
    // ========== UI ==========
    
    connectBtn.onclick = () => {
        const otherId = otherIdInput.value.trim();
        if (!otherId) { alert('Escribe el ID del otro walkie'); return; }
        if (!localStream) { alert('Esperando micrófono...'); return; }
        mostrarMensaje('🔄 Conectando...');
        const c = peer.call(otherId, localStream);
        configurarLlamada(c);
    };
    
    usernameInput.onchange = () => {
        miNombre = usernameInput.value.trim();
        if (miNombre && peer && peer.id) {
            myIdDiv.innerHTML = `📱 TU ID: ${peer.id}<br>📛 ${miNombre}`;
        }
    };
    
    // PTT
    ptt.onmousedown = () => {
        if (connected && localStream && !manosLibresActivo) {
            localStream.getTracks().forEach(t => t.enabled = true);
            ptt.classList.remove('listening');
            ptt.innerHTML = '🔴<br>HABLANDO';
            mostrarMensaje('🔴 Transmitiendo...');
        }
    };
    ptt.onmouseup = () => {
        if (!manosLibresActivo && localStream) {
            localStream.getTracks().forEach(t => t.enabled = false);
            ptt.classList.add('listening');
            ptt.innerHTML = '🎤<br>PTT';
            mostrarMensaje('🎧 Escuchando');
        }
    };
    ptt.onmouseleave = ptt.onmouseup;
    ptt.ontouchstart = (e) => { e.preventDefault(); ptt.onmousedown(); };
    ptt.ontouchend = (e) => { e.preventDefault(); ptt.onmouseup(); };
    
    // Manos libres
    manosLibresBtn.onclick = () => {
        if (!connected) { alert('Conecta primero'); return; }
        manosLibresActivo = !manosLibresActivo;
        if (manosLibresActivo) {
            if (localStream) localStream.getTracks().forEach(t => t.enabled = true);
            manosLibresBtn.innerHTML = '🎙️ MANOS LIBRES (ON)';
            manosLibresBtn.classList.add('activo');
            mostrarMensaje('🎤 Manos libres activado');
        } else {
            if (localStream) localStream.getTracks().forEach(t => t.enabled = false);
            manosLibresBtn.innerHTML = '🔊 MANOS LIBRES (OFF)';
            manosLibresBtn.classList.remove('activo');
            mostrarMensaje('🎧 Modo PTT');
        }
    };
    
    // Alarma
    alarmaBtn.onclick = () => {
        if (!connected) {
            alert('No estás conectado');
            return;
        }
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.3;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.6);
            osc.stop(audioCtx.currentTime + 0.6);
            audioCtx.resume();
            mostrarMensaje('🚨 ¡ALARMA ENVIADA!');
        } catch(e) {
            mostrarMensaje('❌ Error', true);
        }
    };
    
    // Seleccionar archivo
    audioFileInput.onchange = (e) => {
        if (e.target.files.length > 0) {
            archivoSeleccionado = e.target.files[0];
            const tamañoKB = (archivoSeleccionado.size / 1024).toFixed(1);
            enviarBtn.disabled = false;
            infoWav.innerHTML = `✅ ${archivoSeleccionado.name} (${tamañoKB} KB)<br>🔇 Se enviará DIRECTAMENTE - Tú NO lo oyes`;
            mostrarMensaje(`📁 ${archivoSeleccionado.name} listo`);
        }
    };
    
    // Enviar WAV
    enviarBtn.onclick = async () => {
        if (!connected) { alert('Conecta primero al otro walkie'); return; }
        if (archivoSeleccionado) {
            await inyectarWavALlamada(archivoSeleccionado);
        }
    };
    
    // Inicializar
    usernameInput.value = 'WalkieUser';
    miNombre = 'WalkieUser';
    
    window.onbeforeunload = () => {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (audioContext) audioContext.close();
        if (peer) peer.destroy();
    };
</script>
</body>
</html>
